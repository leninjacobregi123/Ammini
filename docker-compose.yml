x-base: &base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: malayalam-llm:latest
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  environment:
    - HOME=/tmp
    - HF_HOME=/workspace/.cache/huggingface
  volumes:
    - ./data:/workspace/data
    - ./tokenizer:/workspace/tokenizer
    - ./checkpoints:/workspace/checkpoints
    - ./.cache:/workspace/.cache
    - ./eval:/workspace/eval
    - ./agent/state:/workspace/agent/state
  stdin_open: true
  tty: true

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # CPU-only stages (download-data, train-tokenizer, prepare-*-data): no GPU
  # reservation at all, so these never depend on GPU availability/policy.
  cpu:
    <<: *base

  # GPU stages (pretrain, instruct-finetune): the only services that actually
  # request a GPU device reservation.
  gpu:
    <<: [*base, *gpu]

  app:
    <<: [*base, *gpu]
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0"]

  # Proper UI: FastAPI + streaming SSE + server/index.html, vs. app's
  # Streamlit debug demo. See server/app.py for CHECKPOINT/TOKENIZER/DEVICE
  # env var overrides.
  api:
    <<: [*base, *gpu]
    ports:
      - "8000:8000"
    command: ["uvicorn", "server.app:app", "--host", "0.0.0.0", "--port", "8000"]
