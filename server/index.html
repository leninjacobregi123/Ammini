<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>അമ്മിണി</title>
<style>
  :root {
    --bg: #f5f5f2;
    --panel: #ffffff;
    --text: #1c1c1a;
    --text-dim: #6b6b66;
    --border: #e2e2dd;
    --user-bubble: #2f6f4f;
    --user-text: #ffffff;
    --assistant-bubble: #ffffff;
    --tool-chip-bg: #eef3ee;
    --tool-chip-text: #2f6f4f;
    --error-bg: #fdecec;
    --error-text: #8a2c2c;
    --accent: #2f6f4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --panel: #1e2023;
      --text: #ececea;
      --text-dim: #9a9a96;
      --border: #2c2e32;
      --user-bubble: #3f8a63;
      --user-text: #ffffff;
      --assistant-bubble: #24262a;
      --tool-chip-bg: #223028;
      --tool-chip-text: #7fd7a8;
      --error-bg: #3a2323;
      --error-text: #f5a3a3;
      --accent: #3f8a63;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Malayalam', 'Manjari', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  header span { font-size: 0.8rem; color: var(--text-dim); }

  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 0.98rem;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.error .bubble {
    background: var(--error-bg);
    color: var(--error-text);
    border: none;
  }

  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--tool-chip-bg);
    color: var(--tool-chip-text);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.78rem;
    margin-bottom: 6px;
  }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: var(--text-dim);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #composer {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    flex-shrink: 0;
  }
  #composer-inner {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.98rem;
    font-family: inherit;
    background: var(--panel);
    color: var(--text);
    max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>അമ്മിണി</h1>
  <span id="status">connecting…</span>
</header>

<div id="transcript"></div>

<div id="composer">
  <div id="composer-inner">
    <textarea id="input" rows="1" placeholder="എന്തെങ്കിലും ചോദിക്കൂ…"></textarea>
    <button id="send">അയക്കുക</button>
  </div>
</div>

<script>
const STORAGE_KEY = "ammini_chat_history";
const transcript = document.getElementById("transcript");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let sending = false;

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
}

function renderAll() {
  transcript.innerHTML = "";
  for (const m of messages) addBubble(m.role, m.content);
  transcript.scrollTop = transcript.scrollHeight;
}

function addBubble(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  transcript.appendChild(row);
  transcript.scrollTop = transcript.scrollHeight;
  return bubble;
}

function addToolChip(name) {
  const row = document.createElement("div");
  row.className = "row assistant";
  const chip = document.createElement("div");
  chip.className = "tool-chip";
  chip.textContent = "🔧 " + (name || "tool");
  row.appendChild(chip);
  transcript.appendChild(row);
  transcript.scrollTop = transcript.scrollHeight;
}

async function checkHealth() {
  try {
    const r = await fetch("/health");
    const j = await r.json();
    statusEl.textContent = j.device + " · " + j.checkpoint.split("/").pop();
  } catch (e) {
    statusEl.textContent = "offline";
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || sending) return;
  sending = true;
  sendBtn.disabled = true;
  input.value = "";
  input.style.height = "auto";

  messages.push({ role: "user", content: text });
  addBubble("user", text);
  saveHistory();

  const assistantBubble = addBubble("assistant", "");
  assistantBubble.innerHTML = '<span class="cursor"></span>';
  let assistantText = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
    });
    if (!res.ok || !res.body) throw new Error("request failed: " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!chunk.startsWith("data: ")) continue;
        const event = JSON.parse(chunk.slice(6));

        if (event.type === "token") {
          assistantText += event.text;
          assistantBubble.textContent = assistantText;
          transcript.scrollTop = transcript.scrollHeight;
        } else if (event.type === "tool_call") {
          addToolChip(event.name);
        } else if (event.type === "error") {
          assistantBubble.parentElement.className = "row error";
          assistantBubble.textContent = "⚠️ " + event.message;
        } else if (event.type === "done") {
          assistantText = event.text || assistantText;
          assistantBubble.textContent = assistantText;
          messages.push({ role: "assistant", content: assistantText });
          saveHistory();
        }
      }
    }
  } catch (e) {
    assistantBubble.parentElement.className = "row error";
    assistantBubble.textContent = "⚠️ " + e.message;
  } finally {
    sending = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener("click", send);

renderAll();
checkHealth();
</script>
</body>
</html>
